plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}
group = 'secret.kinetic'
version = '1.8.9'
java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}
application {
    mainClass = 'net.minecraft.client.main.Main'
}
tasks.named('run') {
    workingDir = file('run')
    systemProperty "java.library.path", file('run')
}
repositories {
    mavenCentral()
    maven {
        url('https://repo.marcloud.net/')
        name('marCloud-Repository')
    }
    maven {
        url "https://libraries.minecraft.net/"
    }
    maven {
        url "https://jitpack.io"
    }
}
dependencies {
    implementation "io.netty:netty-all:4.0.23.Final"
    implementation "com.mojang:patchy:1.7.7"
    implementation "net.sf.jopt-simple:jopt-simple:4.6"
    implementation "org.lwjgl:lwjgl:2.9.4-nightly"
    implementation "org.lwjgl:util:2.9.4-nightly"
    implementation "net.java.jinput:jinput:2.0.5"
    implementation "com.mojang:icu4j-core-mojang:51.2"
    implementation "org.apache.httpcomponents:httpclient:4.3.3"
    implementation "org.apache.httpcomponents:httpcore:4.3.2"
    implementation "oshi:oshi-core:1.1"
    implementation "net.java.dev.jna:jna:3.4.0"
    implementation "net.java.dev.jna:platform:3.4.0"
    implementation "net.java.jutils:jutils:1.0.0"
    implementation "commons-logging:commons-logging:1.1.3"
    implementation "org.apache.commons:commons-compress:1.8.1"
    implementation "org.apache.logging.log4j:log4j-api:2.0-beta9"
    implementation "org.apache.logging.log4j:log4j-core:2.0-beta9"
    implementation "tv.twitch:twitch:6.5"
    implementation "com.google.guava:guava:17.0"
    implementation "org.apache.commons:commons-lang3:3.3.2"
    implementation "commons-io:commons-io:2.4"
    implementation "commons-codec:commons-codec:1.9"
    implementation "com.google.code.gson:gson:2.2.4"
    implementation "com.paulscode.sound:libraryjavasound:20101123"
    implementation "com.paulscode.sound:codecwav:20101023"
    implementation "com.paulscode.sound:soundsystem:20120107"
    implementation "com.paulscode.sound:codecjorbis:20101023"
    implementation "com.paulscode.sound:librarylwjglopenal:20100824"
    implementation "com.mojang:authlib:1.5.21"
    compileOnly "org.projectlombok:lombok:1.18.38"
    annotationProcessor "org.projectlombok:lombok:1.18.38"
    implementation 'org.reflections:reflections:0.10.2'
    implementation files('libs/discord-rpc-1.6.2.jar')
    implementation("com.github.koxx12-dev:ImGui-Java-Lwjgl2:1.0.0")
    implementation("io.github.spair:imgui-java-binding:1.86.11")
    implementation("io.github.spair:imgui-java-natives-windows:1.86.11")
    implementation("io.github.spair:imgui-java-natives-linux:1.86.11")
    implementation("io.github.spair:imgui-java-natives-macos:1.86.11")
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.annotationProcessorPath = configurations.annotationProcessor
    options.release = 8
}
shadowJar {
    archiveBaseName.set('Kinetic')
    archiveClassifier.set('')
    archiveVersion.set('')
    mergeServiceFiles()
    manifest {
        attributes(
                'Main-Class': 'net.minecraft.client.main.Main'
        )
    }
}
build {
    dependsOn shadowJar
}
// Zulu 8 FX: Java 8 with JavaFX, which the PandaAlts WebView needs (Corretto 8 no longer bundles JavaFX)
def jreVersion = 'zulu8.96.0.205-ca-fx-jre8.0.504'
def releaseJres = [
        linux  : [url: "https://cdn.azul.com/zulu/bin/${jreVersion}-linux_x64.tar.gz", tar: true],
        windows: [url: "https://cdn.azul.com/zulu/bin/${jreVersion}-win_x64.zip", tar: false],
]
def distDir = file('dist')
def jreCache = new File(distDir, 'jre-cache')
def full = project.hasProperty('full') && project.property('full').toString() == 'true'

releaseJres.each { osName, jre ->
    def cap = osName.capitalize()
    def stage = new File(distDir, "release-${osName}")
    def jreDir = new File(jreCache, osName)

    def stageTask = tasks.register("releaseStage${cap}") {
        dependsOn tasks.named('shadowJar'), ':launcher:jar'
        doLast {
            if (full && (!new File(jreDir, '.ok').isFile() || new File(jreDir, '.ok').text != jreVersion)) {
                delete jreDir
                jreDir.mkdirs()
                def archive = new File(jreCache, "${jreVersion}-${osName}" + (jre.tar ? '.tar.gz' : '.zip'))
                if (!archive.isFile()) {
                    logger.lifecycle("[release] downloading ${jreVersion} for ${osName}")
                    new URL(jre.url).withInputStream { input -> archive.withOutputStream { out -> out << input } }
                }
                copy {
                    from(jre.tar ? tarTree(resources.gzip(archive)) : zipTree(archive))
                    into jreDir
                    includeEmptyDirs = false
                    eachFile { it.path = it.path.substring(it.path.indexOf('/') + 1) }
                }
                new File(jreDir, '.ok').text = jreVersion
            }
            delete stage
            copy { from tasks.getByPath(':launcher:jar').outputs.files; into stage; rename { 'Kinetic.jar' } }
            copy { from tasks.named('shadowJar').get().outputs.files; into new File(stage, 'client'); rename { 'Kinetic.jar' } }
            copy { from 'launch/launch.sh', 'launch/launch.bat'; into stage }
            copy { from "launch/natives/${osName}"; into new File(stage, "client/natives/${osName}") }
            if (full) {
                copy { from 'launch/assets'; into new File(stage, 'client/assets'); exclude 'skins/**' }
                copy { from jreDir; into new File(stage, 'client/jre'); exclude '.ok' }
            }
        }
    }

    def zipTask = tasks.register("releaseZip${cap}", Zip) {
        dependsOn stageTask
        from stage
        archiveFileName.set(full ? "Kinetic-${osName}-full.zip" : "Kinetic-${osName}.zip")
        destinationDirectory.set(distDir)
        zip64 = true
        eachFile { details ->
            def p = details.path
            if (p == 'launch.sh' || p.startsWith('client/jre/bin/') || p.endsWith('/jspawnhelper') || p.endsWith('/jexec')) details.mode = 0755
        }
        doLast { logger.lifecycle("[release] wrote ${archiveFile.get().asFile} (${(archiveFile.get().asFile.length() / 1e6).round(1)} MB)") }
    }
    tasks.register("release${cap}") { dependsOn zipTask }
}
tasks.register('release') {
    description = 'Builds dist/Kinetic-linux.zip and dist/Kinetic-windows.zip with bundled JREs'
    dependsOn 'releaseLinux', 'releaseWindows'
}
